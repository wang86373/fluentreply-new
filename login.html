<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Login - FluentReply</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#64748b;--border:#d1d5db;
  --soft:#f1f5ff;--blue:#1a73e8;--dark:#0f2b46;
}
body.dark{
  --bg:#0f172a;--card:#111827;--text:#e5e7eb;--muted:#94a3b8;--border:#334155;
  --soft:#1e293b;--blue:#60a5fa;--dark:#2563eb;
}
body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:28px;
}

h1{margin:0 0 10px}
.sub{color:var(--muted);margin-bottom:20px}

input{
  width:100%;
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text)
}

button{
  width:100%;
  margin-top:14px;
  padding:12px;
  border:none;
  border-radius:999px;
  font-weight:bold;
  cursor:pointer
}

.primary{background:var(--blue);color:white}
.secondary{background:transparent;border:1px solid var(--border)}

.status{margin-top:12px;font-size:14px}
.error{color:red}
.success{color:green}
</style>
</head>

<body>

<div class="card">
  <h1>Login</h1>
  <p class="sub">Sign in with password or email code</p>

  <input id="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />

  <button class="primary" onclick="login()">Login</button>

  <button class="secondary" onclick="sendCode()">Send Code</button>

  <input id="code" placeholder="Enter code" />

  <button class="primary" onclick="verify()">Verify Code</button>

  <button class="secondary" onclick="location.href='signup.html'">
    Create account
  </button>

  <div id="status" class="status"></div>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://smwclefrunxnzzjammnu.supabase.co",
  "sb_publishable_DWI3c__Tq7P9z7GSJqhT6g_dzKxwMrb"
);

function msg(t,c=""){
  const el=document.getElementById("status");
  el.className="status "+c;
  el.innerText=t;
}

async function login(){
  const email=document.getElementById("email").value;
  const password=document.getElementById("password").value;

  if(!email||!password){msg("Missing info","error");return;}

  msg("Logging in...");
  const {error}=await supabase.auth.signInWithPassword({email,password});

  if(error){msg(error.message,"error");return;}

  msg("Success","success");
  setTimeout(()=>location.href="index.html",800);
}

async function sendCode(){
  const email=document.getElementById("email").value;
  if(!email){msg("Enter email","error");return;}

  msg("Sending...");
  const {error}=await supabase.auth.signInWithOtp({email});

  if(error){msg(error.message,"error");return;}

  msg("Code sent","success");
}

async function verify(){
  const email=document.getElementById("email").value;
  const code=document.getElementById("code").value;

  if(!email||!code){msg("Missing","error");return;}

  msg("Verifying...");
  const {error}=await supabase.auth.verifyOtp({
    email,
    token:code,
    type:"email"
  });

  if(error){msg(error.message,"error");return;}

  msg("Success","success");
  setTimeout(()=>location.href="index.html",800);
}
</script>

</body>
</html>
